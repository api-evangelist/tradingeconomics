description: >-
  FinOps view of Trading Economics API spend. Unlike usage-metered AI or
  infrastructure APIs, Trading Economics bills flat subscription tiers
  (Standard, Professional, Enterprise) sized by features used, request
  volume, and redistribution rights, billed monthly on yearly commitments.
  Cost optimization is therefore about right-sizing the tier against actual
  request volume and row consumption rather than per-call metering.
notes: >-
  Tier prices were grounded from a June 2026 third-party comparison
  (Standard $149/month, Professional $299/month, billed yearly); verify on
  the provider pricing page during reconciliation.
sources:
- https://tradingeconomics.com/api/pricing.aspx
- https://docs.tradingeconomics.com/get_started/rate-limits/
