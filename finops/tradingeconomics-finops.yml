meters:
- name: api_requests
  description: REST API requests made against the subscription; not billed per call but bounded by plan volume and the 2 requests/second limit.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint_group
- name: data_points
  description: Data points (rows) returned; trial accounts are capped at 100,000 data points, and paid plan sizing tracks volume consumed.
  unit: rows
  aggregation: sum
  dimensions:
  - account
  - endpoint_group
- name: streaming_connections
  description: Concurrent WebSocket connections to wss://stream.tradingeconomics.com and topics subscribed.
  unit: connections
  aggregation: max
  dimensions:
  - account
  - topic
principles:
- name: Visibility
  description: Log request counts and rows returned per endpoint group (indicators, calendar, markets, forecasts, historical) to see what the subscription is actually used for.
- name: Allocation
  description: Front the single API key with an internal proxy that tags consuming teams and workloads, since the provider bills one subscription per account.
- name: Optimization
  description: Cache slow-moving indicator and forecast data (most macro series update monthly or quarterly), use the updates endpoints to sync deltas instead of re-pulling full series, and use the WebSocket stream instead of polling for calendar releases and market ticks.
- name: Accountability
  description: Review request volume against plan size at renewal; downgrade or upgrade the yearly commitment based on observed volume.
